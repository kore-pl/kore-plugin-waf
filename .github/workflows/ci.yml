name: CI

# 触发（2026-11-25 用户裁决）：GitHub Actions **只有 workflow_dispatch**——push（main / tag）与
# pull_request 全部删掉，镜像侧 push / tag 绝不自动触发 GitHub CI；版本触发迁移到 Gitea Actions
# (.gitea/workflows/ci.yml，push tag v* + 手动)。日常反馈用本地 `make check`。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build + check
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
      GOWORK: "off"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: make check
        run: make check

      # CI 里必须显式看到 -race：只对 ./tests/boundary/ 跑（并发断言面）。
      # 与 make check 内的 race 段同源（kore/scripts/race-gate-sync.sh 渲染），
      # 双保险：check 段被误删时这一步仍会以 -race 跑边界用例。
      - name: make race (-race 仅 tests/boundary)
        # 独立执行、不受前序 step 红绿影响：make check 若先因 gofmt / 存量问题失败，
        # race 仍必须真跑（-race 证据不能被别的门禁吞掉）；job 整体仍按失败计。
        if: always()
        run: make race

      - name: make build
        run: make build

  oss:
    name: OSS assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: 九件套 / LICENSE / 占位残留
        run: |
          set -eu
          files="CONTRIBUTING.md SECURITY.md CODE_OF_CONDUCT.md AGENTS.md \
                 .github/PULL_REQUEST_TEMPLATE.md \
                 .github/ISSUE_TEMPLATE/bug_report.yml \
                 .github/ISSUE_TEMPLATE/feature_request.yml \
                 .github/ISSUE_TEMPLATE/config.yml \
                 .github/workflows/ci.yml"
          for f in $files; do
            [ -f "$f" ] || { echo "[FAIL] 缺 $f"; exit 1; }
          done
          grep -qF 'MIT License' LICENSE || { echo "[FAIL] LICENSE 缺 MIT License"; exit 1; }
          grep -qF 'Permission is hereby granted' LICENSE || { echo "[FAIL] LICENSE 缺 MIT 许可句"; exit 1; }
          grep -qF '<!-- oss:begin -->' README.md || { echo "[FAIL] README 缺 oss:begin"; exit 1; }
          grep -qF '<!-- oss:end -->' README.md || { echo "[FAIL] README 缺 oss:end"; exit 1; }
          stale="$(grep -nF '{{' $files | grep -vF '${{' || true)"
          if [ -n "$stale" ]; then
            echo "[FAIL] 生成文件残留占位符："
            echo "$stale"
            exit 1
          fi
          echo "[OK] 九件套 / LICENSE / 占位符检查通过"

  release:
    name: Dist artifact
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: make dist
        run: make dist

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/*.tar.gz
            dist/*.sha256

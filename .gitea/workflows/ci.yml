name: CI (Gitea)

# 触发（2026-11-25 用户裁决「gitea 可以按版本 ci，github 必须是主动触发」）：
#   push tag v* + 手动 workflow_dispatch；GitHub 侧 .github/workflows/ci.yml 只有 workflow_dispatch。
#   job 主体复用 .github/workflows/ci.yml 的 steps（单一真源）。
#   前置：Gitea 服务端必须开启 Actions 且注册可用 act_runner；本仓只提供配置，服务端状态未验证。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitea-ci-${{ gitea.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build + check
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
      GOWORK: "off"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: make check
        run: make check

      - name: make race (-race 仅 tests/boundary)
        if: always()
        run: make race

      - name: make build
        run: make build

  oss:
    name: OSS assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 九件套 / LICENSE / 占位残留
        run: |
          set -eu
          files="CONTRIBUTING.md SECURITY.md CODE_OF_CONDUCT.md AGENTS.md \
                 .github/PULL_REQUEST_TEMPLATE.md \
                 .github/ISSUE_TEMPLATE/bug_report.yml \
                 .github/ISSUE_TEMPLATE/feature_request.yml \
                 .github/ISSUE_TEMPLATE/config.yml \
                 .github/workflows/ci.yml \
                 .gitea/workflows/ci.yml"
          for f in $files; do
            [ -f "$f" ] || { echo "[FAIL] 缺 $f"; exit 1; }
          done
          grep -qF 'MIT License' LICENSE || { echo "[FAIL] LICENSE 缺 MIT License"; exit 1; }
          grep -qF 'Permission is hereby granted' LICENSE || { echo "[FAIL] LICENSE 缺 MIT 许可句"; exit 1; }
          grep -qF '<!-- oss:begin -->' README.md || { echo "[FAIL] README 缺 oss:begin"; exit 1; }
          grep -qF '<!-- oss:end -->' README.md || { echo "[FAIL] README 缺 oss:end"; exit 1; }
          stale="$(grep -nF '{{' $files | grep -vF '${{' || true)"
          if [ -n "$stale" ]; then
            echo "[FAIL] 生成文件残留占位符："
            echo "$stale"
            exit 1
          fi
          echo "[OK] 九件套 / LICENSE / 占位符检查通过"

  release:
    name: Dist artifact
    needs: check
    if: startsWith(gitea.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: make dist
        run: make dist

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/*.tar.gz
            dist/*.sha256
